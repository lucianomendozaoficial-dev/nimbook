<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Actualizar Zuma</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2f3f5; color: #1c1e21;
  }
  .box {
    width: min(420px, calc(100% - 40px)); padding: 28px 24px; border-radius: 22px;
    background: #fff; box-shadow: 0 20px 60px -30px rgba(0,0,0,.35); text-align: center;
  }
  img { width: 58px; height: 58px; border-radius: 17px; }
  h1 { font-size: 22px; margin: 14px 0 6px; }
  p { font-size: 14px; line-height: 1.5; color: #65676b; margin: 0 0 18px; }
  a {
    display: inline-block; padding: 12px 18px; border-radius: 12px;
    background: #0a84ff; color: #fff; font-weight: 700; text-decoration: none;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0b0d; color: #f5f5f7; }
    .box { background: #1c1c1e; }
    p { color: #a1a1aa; }
  }
</style>
</head>
<body>
  <div class="box">
    <img src="assets/logo/zuma-logo-128.png" alt="Zuma">
    <h1>Actualizando Zuma</h1>
    <p id="msg">Borrando la sesión y los datos viejos de este dispositivo…</p>
    <a href="./" id="go" hidden>Volver a Zuma</a>
  </div>
  <script>
    (async function () {
      try { localStorage.clear(); } catch (e) {}
      try { sessionStorage.clear(); } catch (e) {}
      try {
        const keys = await caches.keys();
        await Promise.all(keys.map(function (key) { return caches.delete(key); }));
      } catch (e) {}
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(function (reg) { return reg.unregister(); }));
      } catch (e) {}
      const go = document.getElementById('go');
      go.hidden = false;
      document.getElementById('msg').textContent =
        'Listo. La sesión vieja y los datos guardados en este dispositivo se borraron.';
      setTimeout(function () { location.replace('./?v=' + Date.now()); }, 1200);
    })();
  </script>
</body>
</html>
